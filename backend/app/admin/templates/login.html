<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>LetterBox admin</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #25231f; }
      main { width: min(22rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #d8d1c4; border-radius: .75rem; background: white; box-shadow: 0 .5rem 2rem #3b342514; }
      h1 { margin: 0 0 1.5rem; font-size: 1.4rem; }
      label { display: grid; gap: .4rem; font-weight: 600; }
      input, button { min-height: 2.75rem; border-radius: .4rem; font: inherit; }
      input { border: 1px solid #8b8478; padding: 0 .75rem; }
      button { width: 100%; margin-top: 1rem; border: 0; padding: 0 1rem; background: #25231f; color: white; font-weight: 700; cursor: pointer; }
      .error { color: #a02323; }
    </style>
  </head>
  <body>
    <main>
      <h1>LetterBox admin</h1>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label>Password <input name="password" type="password" autocomplete="current-password" required autofocus></label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
