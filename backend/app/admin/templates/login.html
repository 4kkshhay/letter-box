{% extends "base.html" %}
{% block title %}Sign in · LetterBox admin{% endblock %}
{% block head %}
    <style>
      main.login { width: auto; margin: 0; }
      .login { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
      .login .card { width: min(22rem, 100%); padding: 2rem; }
      .login h1 { margin-bottom: 1.5rem; font-size: 1.4rem; }
      .login label { display: grid; gap: .4rem; font-weight: 600; }
      .login input { min-height: 2.75rem; padding: 0 .75rem; border: 1px solid var(--line); border-radius: .5rem;
        background: var(--surface-2); color: var(--text); font: inherit; }
      .login button { width: 100%; margin-top: 1rem; min-height: 2.75rem; }
      .error { margin: 0 0 1rem; color: var(--danger); }
    </style>
{% endblock %}
{% block body %}
    <main class="login">
      <div class="card">
        <h1>LetterBox admin</h1>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
          <label>Password <input name="password" type="password" autocomplete="current-password" required autofocus></label>
          <button class="primary" type="submit">Sign in</button>
        </form>
      </div>
    </main>
{% endblock %}
