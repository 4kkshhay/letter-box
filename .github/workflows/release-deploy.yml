name: Release and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA to deploy (blank deploys the current main commit)
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DEPLOY_PATH: /srv/letter-box

jobs:
  release:
    name: Build and release image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: app
          platforms: linux/arm64
          # One plain manifest per release, so GHCR retention counts releases
          # rather than attestation and index entries.
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://letterbox.ink
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate selected release
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "${#RELEASE_SHA}" -eq 40
          case "$RELEASE_SHA" in
            *[!0-9a-f]*) exit 1 ;;
          esac
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy runtime files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -o BatchMode=yes "$target" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp -o BatchMode=yes docker-compose.yml docker-compose.production.yml "$target:$DEPLOY_PATH/"
          scp -o BatchMode=yes scripts/export-db "$target:$DEPLOY_PATH/scripts/"
      - name: Pull and start released image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:sha-${{ inputs.release_sha || github.sha }}
          REMOTE_DOCKER_CONFIG: /dev/shm/letterbox-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -o BatchMode=yes "$target" \
            "install -m 700 -d '$REMOTE_DOCKER_CONFIG'"
          if ! printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$target" \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null 2>&1"
          then
            echo "GHCR login failed" >&2
            exit 1
          fi
          echo "Authenticated to GHCR using an ephemeral in-memory Docker config."
          ssh -o BatchMode=yes "$target" bash -s -- \
            "$DEPLOY_PATH" "$IMAGE_REF" "$REMOTE_DOCKER_CONFIG" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          requested_image="$2"
          export DOCKER_CONFIG="$3"
          export APP_IMAGE="$requested_image"
          compose=(docker compose -f docker-compose.yml -f docker-compose.production.yml)
          cleanup_registry() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -f -- "$DOCKER_CONFIG/config.json"
            rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true
          }
          trap cleanup_registry EXIT
          test -f .env
          test -d data
          chmod +x scripts/export-db
          "${compose[@]}" config --quiet
          "${compose[@]}" pull app cloudflared
          APP_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' "$requested_image")
          test -n "$APP_IMAGE"
          export APP_IMAGE
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --no-build --remove-orphans --wait
          "${compose[@]}" exec -T app python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3); urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"
          printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > .release.env.tmp
          mv .release.env.tmp .release.env
          # Remove this project's older app images only; rollback pulls from GHCR.
          current_id=$(docker image inspect --format '{{.Id}}' "$APP_IMAGE")
          echo "Keeping current image $current_id"
          docker image ls --no-trunc --filter "reference=${requested_image%:*}:*" --format '{{.ID}}' |
            sort -u | while read -r image_id; do
              [ "$image_id" != "$current_id" ] || continue
              if docker image rm -f "$image_id" >/dev/null; then
                echo "Removed old image $image_id"
              else
                echo "Warning: could not remove old image $image_id" >&2
              fi
            done
          "${compose[@]}" ps
          REMOTE
      - name: Retain seven most recent images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 7
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove remote registry credential
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_DOCKER_CONFIG: /dev/shm/letterbox-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -o BatchMode=yes "$target" \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker logout ghcr.io >/dev/null 2>&1 || true; rm -f -- '$REMOTE_DOCKER_CONFIG/config.json'; rmdir -- '$REMOTE_DOCKER_CONFIG' 2>/dev/null || true" \
            || true
