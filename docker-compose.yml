# Base stack. Publishes no host ports; see docker-compose.local.yml.
name: letterbox

services:
  app:
    image: ${APP_IMAGE:-letterbox:latest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Must be able to write the data directory on the host.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8610}
      DATABASE_PATH: /data/letterbox.db
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ${DATA_DIR:-./data}:/data
    mem_limit: 256m
